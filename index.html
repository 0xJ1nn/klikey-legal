<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KliKey · Legal</title>
<meta name="description" content="KliKey legal pages: privacy policy and terms of service.">
<style>
  :root { color-scheme: light dark; --fg:#111113; --muted:#6E6E75; --bg:#fff; --line:#E5E5E8; --card:#FAFAFB; }
  @media (prefers-color-scheme: dark) { :root { --fg:#F2F2F3; --muted:#9A9AA1; --bg:#0C0C0E; --line:#26262A; --card:#131316; } }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; }
  body { background:var(--bg); color:var(--fg); font:400 16px/1.65 -apple-system, "Segoe UI", Roboto, Inter, system-ui, sans-serif; -webkit-text-size-adjust:100%; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 72px 24px 80px; }
  .brand { font-weight:700; letter-spacing:-.02em; font-size:20px; }
  h1 { font-size: 34px; letter-spacing:-.02em; margin: 26px 0 10px; }
  p { color: var(--muted); margin: 0 0 26px; }
  a.card { display:block; border:1px solid var(--line); border-radius:14px; padding: 18px 20px; margin-bottom: 14px; text-decoration:none; color: var(--fg); background: var(--card); }
  a.card b { display:block; font-size:17px; margin-bottom:2px; }
  a.card span { color: var(--muted); font-size:14px; }
  footer { margin-top: 48px; padding-top: 20px; border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">KliKey.</div>
  <h1>Legal</h1>
  <p>The documents that come with the KliKey keyboard app.</p>
  <a class="card" href="/klikey-legal/privacy/"><b>Privacy Policy</b><span>What KliKey does with your information. Short version: everything stays on your phone.</span></a>
  <a class="card" href="/klikey-legal/terms/"><b>Terms of Service</b><span>Licence, purchases, acceptable use and availability.</span></a>
  <footer>© 2026 KliKey · <a href="mailto:jinultimate1995@gmail.com">Contact</a></footer>
</div>
</body>
</html>
